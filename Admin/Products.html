<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" href="../Common.css">
    <link rel="stylesheet" href="Products.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>
    <script src="Products.js" defer></script>
</head>
<body>
    <header>
        <div class="logo"><img src="../Landing/OreoBitesLogo.jpg" alt="OreoBites logo"></div>
        <nav>
            <ul>
                <li><a href="Dashboard.html">Dashboard</a></li>
                <li><a href="Products.html">Products</a></li>
                <li><a href="Orders.html">Orders</a></li>
                <li><a href="Customers.html">Customers</a></li>
            </ul>
        </nav>
        <a href="#logout" aria-label="Log out" class="logout-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
        </a>
    </header>

    <main>
        <!-- VIEW 1: product table -->
        <section class="products-view active" id="products-view">
            <div class="products-header">
                <h1>Products</h1>
                <button id="add-product-btn" class="add-product-btn">ADD PRODUCT</button>
            </div>

            <table class="products-table">
                <thead>
                    <tr>
                        <th>Photo</th>
                        <th>Name</th>
                        <th>Variant</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="products-table-body">
                    <!-- JS fills this in -->
                </tbody>
            </table>
        </section>

        <!-- VIEW 2: add/edit form -->
        <section class="product-form-view" id="product-form-view">
            <h1>Products</h1>

            <form id="product-form" class="product-form">
                <input type="hidden" id="product-id">

                <div class="form-top-row">
                    <div class="photo-preview" id="photo-preview">
                        <span>No image</span>
                    </div>

                    <div class="photo-upload">
                        <label>Product Photo</label>
                        <input type="file" id="product-photo" accept="image/*">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-field wide">
                        <label for="product-name">Product Name</label>
                        <input type="text" id="product-name" required>
                    </div>
                    <div class="form-field">
                        <label for="product-variant">Variant</label>
                        <input type="text" id="product-variant">
                    </div>
                    <div class="form-field">
                        <label for="product-price">Price</label>
                        <input type="number" id="product-price" required>
                    </div>
                    <div class="form-field">
                        <label for="product-stock">Stocks</label>
                        <input type="number" id="product-stock" required>
                    </div>
                </div>

                <div class="form-field wide">
                    <label for="product-description">Description</label>
                    <textarea id="product-description" rows="4" required></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" id="cancel-btn" class="cancel-btn">Cancel</button>
                    <button type="submit" class="save-btn">Save Product</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
    <div class="footer-container">
        <div class="footer-brand">
            <div class="footer-logo"><img src="../Landing/OreoBitesLogo.jpg" alt="OreoBites logo"></div>
        </div>
        <nav class="footer-nav">
            <ul>
                <li><a href="Dashboard.html">Dashboard</a></li>
                <li><a href="Products.html">Products</a></li>
                <li><a href="Orders.html">Orders</a></li>
                <li><a href="Customers.html">Customers</a></li>
            </ul>
        </nav>
    </div>
    <p class="footer-disclaimer">School Purposes Only - 2026</p>
    </footer>
</body>
</html>
