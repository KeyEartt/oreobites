<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers</title>
    <link rel="stylesheet" href="../Common.css">
    <link rel="stylesheet" href="Customers.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>
    <script src="Customers.js" defer></script>
</head>
<body>
    <header>
        <div class="logo"><img src="../Landing/OreoBitesLogo.jpg" alt="OreoBites logo"></div>
        <nav>
            <ul>
                <li><a href="Dashboard.html">Dashboard</a></li>
                <li><a href="Products.html">Products</a></li>
                <li><a href="Orders.html">Orders</a></li>
                <li><a href="Customers.html">Customers</a></li>
            </ul>
        </nav>
        <a href="#logout" aria-label="Log out" class="logout-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
        </a>
    </header>

    <main>
        <section class="customers-view active" id="customers-view">
            <h1>Customers</h1>

            <table class="customers-table">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Year and Section</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="customers-table-body"></tbody>
            </table>
        </section>

        <section class="customer-detail-view" id="customer-detail-view">
            <button type="button" id="back-to-list-btn" class="back-btn">&larr; Back</button>

            <div class="customer-detail-card">
                <div class="customer-detail-header">
                    <div class="customer-avatar">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <div>
                        <h2 id="detail-name"></h2>
                        <p id="detail-student-id" class="detail-subtext"></p>
                    </div>
                </div>

                <div class="detail-grid">
                    <div class="detail-field">
                        <label>Email</label>
                        <p id="detail-email"></p>
                    </div>
                    <div class="detail-field">
                        <label>Phone</label>
                        <p id="detail-phone"></p>
                    </div>
                    <div class="detail-field">
                        <label>Year and Section</label>
                        <p id="detail-year-section"></p>
                    </div>
                    <div class="detail-field">
                        <label>Campus</label>
                        <p id="detail-campus"></p>
                    </div>
                </div>

                <div class="detail-field wide">
                    <label>Address</label>
                    <p id="detail-address"></p>
                </div>

                <div class="order-history">
                    <label>Order History</label>
                    <ul id="order-history-list"></ul>
                </div>

                <button type="button" id="deactivate-btn" class="deactivate-btn">Deactivate Account</button>
            </div>
        </section>
    </main>

    <footer>
    <div class="footer-container">
        <div class="footer-brand">
            <div class="footer-logo"><img src="../Landing/OreoBitesLogo.jpg" alt="OreoBites logo"></div>
        </div>
        <nav class="footer-nav">
            <ul>
                <li><a href="Dashboard.html">Dashboard</a></li>
                <li><a href="Products.html">Products</a></li>
                <li><a href="Orders.html">Orders</a></li>
                <li><a href="Customers.html">Customers</a></li>
            </ul>
        </nav>
    </div>
    <p class="footer-disclaimer">School Purposes Only - 2026</p>
    </footer>
</body>
</html>
